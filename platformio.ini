; PlatformIO проект для ESP32-S3-N16R8
; Мониторинг RSS опасностей ГКЧС Республики Башкортостан
;
; Платы: esp32-s3-devkitc-1 (N16R8 — 16 МБ flash, 8 МБ PSRAM OPI)

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; 16 МБ flash, OPI PSRAM (как у N16R8)
board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB

; LittleFS как файловая система для хранения состояния
board_build.filesystem = littlefs

build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D CONFIG_FREERTOS_HZ=1000
    -Wno-deprecated-declarations

monitor_speed = 115200

lib_deps =
    ; JSON — сериализация состояния (state.json) и сообщений для UART
    bblanchon/ArduinoJson @ ^7.0.0

    ; Парсинг XML/RSS на ядре EXPAT (библиотека ESP32XMLParser).
    ; Канонический репозиторий: https://github.com/RoboticsBrno/RB3202-ESP32XMLParser
    ; В валидированном Registry-зеркале библиотека недоступна из этой среды,
    ; поэтому используется локальная копия в lib/ESP32XMLParser (см. этот проект).
    ; Если нужна установка из сети — раскомментируйте одну из строк ниже:
    ; https://github.com/RoboticsBrno/RB3202-ESP32XMLParser/archive/refs/heads/master.zip
